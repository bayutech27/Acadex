<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acadex - Create School</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .suggestions-label { font-size: 0.85rem; color: #4b5563; margin-top: 8px; margin-bottom: 4px; }
    .suggestions-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .suggestion-chip { background: #e2e8f0; border: none; border-radius: 20px; padding: 4px 12px; font-size: 0.8rem; cursor: pointer; transition: background 0.2s; }
    .suggestion-chip:hover:not(.taken) { background: #cbd5e1; }
    .suggestion-chip.taken { background: #fee2e2; color: #991b1b; cursor: not-allowed; opacity: 0.6; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 4px; font-weight: 500; color: #1e293b; }
    input, textarea { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
    button[type="submit"] { width: 100%; padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .links { text-align: center; margin-top: 16px; }
    .message { margin-top: 16px; }

    /* 🔐 Password visibility toggle */
    .password-wrapper { position: relative; display: flex; align-items: center; }
    .password-wrapper input { padding-right: 40px; }
    .toggle-password {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      transition: color 0.2s;
      line-height: 0;
    }
    .toggle-password:hover { color: #1e293b; }
    .toggle-password svg { width: 20px; height: 20px; }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1><span class="acadex-brand"><span class="acadex-a">A</span>cadex</span></h1>
    <h2>Create your school</h2>
    <form id="signupForm">
      <div class="form-group">
        <label for="schoolName">School Name *</label>
        <input type="text" id="schoolName" placeholder="e.g., Excel International School" required>
      </div>
      <div class="form-group">
        <label for="username">Username *</label>
        <input type="text" id="username" placeholder="e.g., excel-school" required>
        <div id="usernameSuggestions"></div>
        <small>Your unique identifier for the school dashboard URL. Lowercase letters, numbers, and hyphens only.</small>
      </div>
      <div class="form-group">
        <label for="schoolPhone">Phone Number</label>
        <input type="tel" id="schoolPhone" placeholder="e.g., +234 801 234 5678">
      </div>
      <div class="form-group">
        <label for="schoolAddress">School Address *</label>
        <textarea id="schoolAddress" placeholder="street, city, state, country" rows="3" required></textarea>
      </div>
      <div class="form-group">
        <label for="email">Admin Email *</label>
        <input type="email" id="email" placeholder="admin@school.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password *</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="At least 6 characters" required>
          <button type="button" class="toggle-password" aria-label="Toggle password visibility">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="eye-icon">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>
        </div>
      </div>
      <button type="submit">Create School</button>
    </form>
    <div class="links">
      <a href="index.html">Already have an account? Login</a>
    </div>
    <div id="message" class="message"></div>
  </div>
</div>

<script type="module">
  import { initSignupPage } from './js/auth.js';
  initSignupPage();
</script>
</body>
</html>
