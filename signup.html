<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Acadex - Create your school</title>

  <!-- 
    ========== MODERN, RESPONSIVE CSS (preserves all existing classes/IDs) ==========
    - New visual design: clean card, soft shadows, better readability.
    - Keeps all existing classes like .suggestion-chip, .password-wrapper, .toggle-password, .form-group, etc.
    - Adds modal styling.
  -->
  <style>
    /* ----- RESET & GLOBAL ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #e9f0f5 0%, #d9e2ec 100%);
      font-family: system-ui, 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      padding: 2rem 1.25rem;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 580px;
      margin: 0 auto;
    }

    /* card – modern redesign */
    .card {
      background: #ffffff;
      border-radius: 2rem;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.25), 0 2px 6px rgba(0, 0, 0, 0.02);
      padding: 2rem 1.8rem;
      transition: all 0.2s ease;
    }

    /* branding */
    h1 {
      text-align: center;
      margin-bottom: 0.25rem;
    }
    .acadex-brand {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #1f5e3a, #2b9b5c);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .acadex-a {
      background: none;
      color: #1f5e3a;
    }
    h2 {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 600;
      color: #1e2f3f;
      margin-bottom: 1.5rem;
      letter-spacing: -0.2px;
    }

    /* form groups – preserved structure but nicer spacing */
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 0.4rem;
      color: #1f3b4c;
    }
    input, textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      font-size: 0.95rem;
      border: 1.5px solid #e2edf2;
      border-radius: 1.2rem;
      background: #fefefe;
      transition: all 0.2s;
      font-family: inherit;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #2b7a4b;
      box-shadow: 0 0 0 3px rgba(43, 122, 75, 0.15);
    }
    textarea {
      border-radius: 1.2rem;
      resize: vertical;
    }
    button[type="submit"] {
      width: 100%;
      background: #1f5e3a;
      border: none;
      padding: 0.85rem;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      border-radius: 2rem;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s, transform 0.05s;
      font-family: inherit;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
    }
    button[type="submit"]:hover {
      background: #144f2f;
    }
    button[type="submit"]:active {
      transform: scale(0.98);
    }

    /* suggestions & chips (preserved layout, enhanced colors) */
    .suggestions-label {
      font-size: 0.8rem;
      color: #2c5a6e;
      margin-top: 6px;
      margin-bottom: 4px;
      font-weight: 500;
    }
    .suggestions-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .suggestion-chip {
      background: #eef2f7;
      border: none;
      border-radius: 2rem;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      color: #1f3b4c;
    }
    .suggestion-chip:hover:not(.taken) {
      background: #d4e0e9;
      transform: scale(0.97);
    }
    .suggestion-chip.taken {
      background: #ffe3e3;
      color: #b91c1c;
      cursor: not-allowed;
      opacity: 0.7;
    }
    small {
      font-size: 0.7rem;
      color: #5a7184;
      display: block;
      margin-top: 0.25rem;
    }

    /* password wrapper (preserved) */
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .password-wrapper input {
      padding-right: 45px;
    }
    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #6c86a3;
      transition: color 0.2s;
    }
    .toggle-password:hover {
      color: #1f5e3a;
    }
    .toggle-password svg {
      width: 20px;
      height: 20px;
    }

    /* links area & terms row */
    .links {
      text-align: center;
      margin-top: 1.2rem;
    }
    .links a {
      color: #1f5e3a;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.85rem;
      border-bottom: 1px solid transparent;
      transition: border 0.2s;
    }
    .links a:hover {
      border-bottom: 1px solid #1f5e3a;
    }

    /* NEW: terms agreement row (bottom of form, above .links) */
    .terms-agreement {
      margin-top: 1.5rem;
      padding-top: 0.5rem;
      text-align: center;
      font-size: 0.85rem;
      border-top: 1px solid #e2edf2;
      color: #2c5068;
    }
    .terms-agreement a {
      color: #1f5e3a;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px dotted #8bbf9f;
      cursor: pointer;
    }
    .terms-agreement a:hover {
      border-bottom: 1px solid #1f5e3a;
    }

    /* ----- MODAL (TERMS & CONDITIONS) ----- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      visibility: hidden;
      opacity: 0;
      transition: visibility 0.2s, opacity 0.2s ease;
    }
    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }
    .modal-container {
      background: #ffffff;
      width: 90%;
      max-width: 920px;
      max-height: 85vh;
      border-radius: 2rem;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: modalFadeIn 0.25s ease;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.8rem;
      border-bottom: 1px solid #e9f0f3;
      background: #ffffff;
    }
    .modal-header h2 {
      font-size: 1.5rem;
      margin: 0;
      font-weight: 700;
      color: #1f5e3a;
      background: none;
      text-align: left;
    }
    .close-modal {
      background: none;
      border: none;
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
      color: #6c86a3;
      transition: color 0.2s;
      padding: 0 6px;
    }
    .close-modal:hover {
      color: #b91c1c;
    }
    .modal-body {
      padding: 1.5rem 2rem;
      overflow-y: auto;
      flex: 1;
      font-size: 0.94rem;
      line-height: 1.55;
      color: #1f2e3a;
      background: #fcfdfe;
    }
    /* terms content styling */
    .modal-body h1 {
      font-size: 1.7rem;
      margin-top: 0;
      margin-bottom: 0.25rem;
      color: #1c482e;
    }
    .modal-body h2 {
      font-size: 1.25rem;
      margin: 1.2rem 0 0.4rem;
      color: #1f5e3a;
      border-left: 4px solid #2b7a4b;
      padding-left: 0.8rem;
    }
    .modal-body p, .modal-body li {
      margin-bottom: 0.6rem;
    }
    .modal-body ul, .modal-body ol {
      margin: 0.3rem 0 0.8rem 1.5rem;
    }
    .modal-footer {
      padding: 0.9rem 2rem;
      border-top: 1px solid #eef2f7;
      background: #ffffff;
      text-align: right;
    }
    .btn-close-modal {
      background: #eef2f7;
      border: none;
      padding: 0.5rem 1.5rem;
      border-radius: 2rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-close-modal:hover {
      background: #dee5ed;
    }

    /* message area */
    .message {
      margin-top: 1rem;
      font-size: 0.85rem;
      text-align: center;
    }

    /* responsive */
    @media (max-width: 550px) {
      .card {
        padding: 1.5rem;
      }
      .modal-body {
        padding: 1rem;
      }
      .modal-header h2 {
        font-size: 1.3rem;
      }
      .modal-body h1 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1><span class="acadex-brand"><span class="acadex-a">A</span>cadex</span></h1>
    <h2>Create your school</h2>

    <!-- ORIGINAL FORM: IDs, classes, fields completely untouched -->
    <form id="signupForm">
      <div class="form-group">
        <label for="schoolName">School Name *</label>
        <input type="text" id="schoolName" placeholder="e.g., Excel International School" required>
      </div>
      <div class="form-group">
        <label for="username">Username *</label>
        <input type="text" id="username" placeholder="e.g., excel-school" required>
        <div id="usernameSuggestions"></div>
        <small>Your unique identifier for the school dashboard URL. Lowercase letters, numbers, and hyphens only.</small>
      </div>
      <div class="form-group">
        <label for="schoolPhone">Phone Number</label>
        <input type="tel" id="schoolPhone" placeholder="e.g., +234 801 234 5678">
      </div>
      <div class="form-group">
        <label for="schoolAddress">School Address *</label>
        <textarea id="schoolAddress" placeholder="street, city, state, country" rows="3" required></textarea>
      </div>
      <div class="form-group">
        <label for="email">Admin Email *</label>
        <input type="email" id="email" placeholder="admin@school.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password *</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="At least 6 characters" required>
          <button type="button" class="toggle-password" aria-label="Toggle password visibility">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="eye-icon">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>
        </div>
      </div>
      <button type="submit">Create School</button>
    </form>

    <!-- NEW TERMS LINK (added exactly as required: bottom of the form, notifying agreement) -->
    <div class="terms-agreement">
      <span>📖 By creating an account, you agree to our </span>
      <a id="openTermsModalLink" style="cursor:pointer;">Terms and Conditions</a><span>.</span>
    </div>

    <div class="links">
      <a href="index.html">Already have an account? Login</a>
    </div>
    <div id="message" class="message"></div>
  </div>
</div>

<!-- MODAL (Terms & Conditions) – exact legal text from Acadex -->
<div id="termsModal" class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <h2>📄 Terms & Conditions</h2>
      <button class="close-modal" id="closeModalBtn" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="termsModalBody">
      <!-- full terms injected via JS (ensures exact copy & readability) -->
    </div>
    <div class="modal-footer">
      <button class="btn-close-modal" id="modalFooterCloseBtn">Close</button>
    </div>
  </div>
</div>

<!-- 
  EXISTING SCRIPT (module) – untouched, loads initSignupPage from './js/auth.js'
  Additionally we add a small inline script for modal control (does not interfere with existing JS)
-->
<script type="module">
  import { initSignupPage } from './js/auth.js';
  // preserve original initialisation exactly as it was
  initSignupPage();
</script>

<script>

      <p>The School agrees to indemnify Acadex, the Company, its directors, employees, and affiliates from any claims, damages, or expenses arising from misuse of the platform, violation of these Terms, unauthorized data usage, educational disputes, uploaded content, or legal violations by the School.</p>
      
      <h2>17. Privacy</h2>
      <p>Acadex may collect and process data necessary for operation. By using the service, the School consents to collection, storage, and processing for legitimate operational purposes. Acadex may use aggregated anonymized data for analytics, system improvement, and security monitoring. Acadex will not intentionally sell confidential school records to third parties.</p>

      <p>Acadex reserves the right to update these Terms at any time. Updated Terms become effective once published. Continued use constitutes acceptance of the revised Terms.</p>

      <p>These Terms shall be governed by the laws applicable within the jurisdiction where the Company operates. Any disputes shall be subject to the exclusive jurisdiction of the competent courts within that jurisdiction.</p>

      <p>These Terms constitute the complete agreement between the School and Acadex regarding use of the platform and supersede prior discussions or agreements relating to the service.</p>

      <p>For support or legal communication, schools may contact Acadex through official support channels on the platform or website.</p>
      
      <p><strong>Agreement</strong><br>By checking the agreement box during signup or by using the Acadex platform, you acknowledge that: 1) You have read and understood these Terms and Conditions. 2) You agree to be legally bound by them. 3) You are authorized to act on behalf of your institution. 4) Your institution accepts full responsibility for its users and data.</p>

    const modalBody = document.getElementById('termsModalBody');
    if (modalBody) modalBody.innerHTML = termsHTML;

    // modal elements
    const modalOverlay = document.getElementById('termsModal');
    const openLink = document.getElementById('openTermsModalLink');
    const closeBtns = [document.getElementById('closeModalBtn'), document.getElementById('modalFooterCloseBtn')];

    function openModal() {
      modalOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function closeModal() {
      modalOverlay.classList.remove('active');
      document.body.style.overflow = '';
    }
    if (openLink) openLink.addEventListener('click', (e) => { e.preventDefault(); openModal(); });
    closeBtns.forEach(btn => { if(btn) btn.addEventListener('click', closeModal); });
    modalOverlay.addEventListener('click', (e) => { if(e.target === modalOverlay) closeModal(); });
    document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && modalOverlay.classList.contains('active')) closeModal(); });
  })();
</script>
<script>
  // Unregister any existing service worker, then clear all its caches.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      for (let registration of registrations) {
        registration.unregister();
      }
    }).catch(function(err) {
      console.log('Service Worker unregistration failed: ', err);
    });

    // Also delete all caches just in case.
    if (window.caches) {
      caches.keys().then(function(cacheNames) {
        cacheNames.forEach(function(cacheName) {
          caches.delete(cacheName);
        });
      });
    }
  }
</script>
</body>
</html>
