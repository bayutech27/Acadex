    /* =========================================================
       iOS DESIGN TOKENS — dark variant
       ========================================================= */
    :root {

      --bg-elevated:   #1F1C3F;
      --bg-elevated-2: #282350;
      --bg-elevated-3: #312B60;

      --text-primary:   #F8F8FF;
      --text-secondary: rgba(235, 235, 245, 0.65);
      --text-tertiary:  rgba(235, 235, 245, 0.42);

      --border-subtle:  rgba(255, 255, 255, 0.08);
      --border-default: rgba(255, 255, 255, 0.12);
      --border-strong:  rgba(255, 255, 255, 0.18);

      --fill-subtle:    rgba(255, 255, 255, 0.04);
      --fill-strong:    rgba(255, 255, 255, 0.08);

      --ios-blue:       #0A84FF;
      --ios-blue-600:   #0066CC;
      --ios-green:      #30D158;
      --ios-green-600:  #248A3D;
      --ios-indigo:     #5E5CE6;
      --ios-orange:     #FF9F0A;
      --ios-purple:     #BF5AF2;
      --ios-purple-600: #8B34B8;

      --ios-teal:       #64D2FF;

      --shadow-lg: 0 8px 28px rgba(0, 0, 0, 0.35);

      --ios-radius-sm: 10px;
      --ios-radius:    14px;
      --ios-radius-lg: 18px;
      --ios-radius-xl: 22px;

      --ios-font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Inter', 'Poppins', 'Helvetica Neue', Arial, sans-serif;
      --ios-font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Montserrat', 'Helvetica Neue', Arial, sans-serif;

      --ios-smooth: cubic-bezier(0.25, 0.1, 0.25, 1);
      --ios-spring: cubic-bezier(0.34, 1.4, 0.64, 1);

    html { background: var(--bg-base) !important; }
    body {

    /* BOOT LOADER */
    .cbt-boot-loader {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      background: rgba(22, 19, 43, 0.82);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      z-index: 2147483000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.35s ease;
    }
    .cbt-boot-loader.cbt-boot-fadeout { opacity: 0; pointer-events: none; }
    .cbt-boot-loader.cbt-boot-gone    { display: none; }
    .cbt-boot-spinner svg { display: block; width: 52px; height: 52px; }
    .cbt-boot-track { stroke: rgba(10, 132, 255, 0.20); }
    .cbt-boot-ring {
      stroke: #0A84FF;

      transform-origin: center;

    @keyframes cbtBootSpin { to { transform: rotate(360deg); } }
    .cbt-boot-label {
      color: rgba(248, 248, 255, 0.85);
      font-family: var(--ios-font);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: -0.005em;

    .take-test-btn {

    /* MOBILE RESPONSIVE */

<script>
// Acadex session validation
(function() {
  const schoolId = localStorage.getItem('userSchoolId');
  const studentId = localStorage.getItem('studentId');
  if (!schoolId || !studentId) {
    alert('Invalid session. Please log in again.');
    window.location.href = '../../index.html';
  }
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(registrations) {
    for(let registration of registrations) registration.unregister();
  });
  if (caches) {
    caches.keys().then(names => names.forEach(name => caches.delete(name)));
  }
}
</script>

<!-- BOOT LOADER -->
<div id="cbtBootLoader" class="cbt-boot-loader" role="status" aria-live="polite">
  <div class="cbt-boot-spinner">
    <svg viewBox="0 0 40 40">
      <circle class="cbt-boot-track" cx="20" cy="20" r="16" fill="none" stroke-width="3"/>
      <circle class="cbt-boot-ring" cx="20" cy="20" r="16" fill="none" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="25 100"/>
    </svg>
  </div>
  <div class="cbt-boot-label">Loading CBT Dashboard…</div>
</div>

<script>
(function () {
  var loader = document.getElementById('cbtBootLoader');
  if (!loader) return;

  var showTime = Date.now();
  var done = false;

  function hideNow() {
    if (done) return;
    done = true;
    var elapsed = Date.now() - showTime;
    var wait = Math.max(0, 900 - elapsed);
    setTimeout(function () {
      loader.classList.add('cbt-boot-fadeout');
      setTimeout(function () {
        loader.classList.add('cbt-boot-gone');
      }, 400);
    }, wait);
  }

  window.__cbtBootLoaderHide = hideNow;

  var failsafe = setTimeout(hideNow, 15000);

  function tryObserve() {
    var assignedEl = document.getElementById('assignedTestsTableWrapper');
    var userEl = document.getElementById('userName');

    if (!assignedEl && !userEl) {
      setTimeout(tryObserve, 100);
      return;
    }

    function check() {
      if (assignedEl) {
        var txt = (assignedEl.textContent || '').trim();
        if (txt && txt.indexOf('Loading assigned tests') === -1) {
          clearTimeout(failsafe);
          hideNow();
          return true;
        }
      }
      if (userEl) {
        var txt = (userEl.textContent || '').trim();
        if (txt.length > 0) {
          clearTimeout(failsafe);
          hideNow();
          return true;
        }
      }
      return false;
    }

    if (check()) return;

    var observer = new MutationObserver(function () {
      if (check()) observer.disconnect();
    });
    if (assignedEl) {
      observer.observe(assignedEl, { childList: true, subtree: true, characterData: true });
    }
    if (userEl) {
      observer.observe(userEl, { childList: true, subtree: true, characterData: true });
    }
  }

  tryObserve();
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      for (let registration of registrations) {
        registration.unregister();
      }
    }).catch(function(err) {
      console.log('Service Worker unregistration failed: ', err);
    });

    if (window.caches) {
      caches.keys().then(function(cacheNames) {
        cacheNames.forEach(function(cacheName) {
          caches.delete(cacheName);
        });
      });
    }
  }
</script>
