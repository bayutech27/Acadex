<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Acadex - Login</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Nunito:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    /* ========== RESET & BASE ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Brand palette */
      --deep-purple: #1a0b2e;
      --purple-dark: #2D033B;
      --purple-mid: #6A11CB;
      --purple-light: #9D4EDD;
      --magenta: #E100FF;
      --gold: #FFD700;
      --gold-dark: #D4A017;
      --white: #FFFFFF;
      --off-white: #F8F7FF;
      --text-dark: #111827;
      --text-muted: #6B7280;

      /* iOS design tokens — shared with dashboard pages */
      --ios-label:            #000000;
      --ios-label-secondary:  rgba(60, 60, 67, 0.60);
      --ios-separator:        rgba(60, 60, 67, 0.12);
      --ios-fill:             rgba(120, 120, 128, 0.12);
      --ios-fill-2:           rgba(120, 120, 128, 0.08);
      --ios-radius-sm: 10px;
      --ios-radius:    14px;
      --ios-radius-lg: 18px;
      --ios-radius-xl: 22px;

      --ios-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --ios-shadow:    0 1px 3px rgba(0, 0, 0, 0.04), 0 4px 12px rgba(0, 0, 0, 0.04);
      --ios-shadow-lg: 0 8px 28px rgba(0, 0, 0, 0.08);
      --ios-shadow-xl: 0 20px 50px rgba(0, 0, 0, 0.12);

      --ios-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
      --ios-smooth: cubic-bezier(0.25, 0.1, 0.25, 1);

      /* Brand shadows (kept for Acadex identity) */
      --shadow-sm: 0 2px 12px rgba(106,17,203,0.12);
      --shadow-md: 0 10px 30px rgba(106,17,203,0.18);

      --font-heading: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Outfit', 'Inter', sans-serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Nunito', 'Inter', sans-serif;
      --radius: 16px;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      background-color: #ffffff;
      color: var(--text-dark);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      letter-spacing: -0.011em;
    }

    /* ========== FIXED BACK-TO-HOME (top-left, iOS glass) ========== */
    .back-home {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.85);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      color: var(--purple-mid);
      border: 1px solid rgba(106, 17, 203, 0.15);
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.88rem;
      letter-spacing: -0.005em;
      box-shadow: 0 4px 16px rgba(106, 17, 203, 0.08);
      transition: transform 0.2s var(--ios-spring),
                  background 0.2s ease,
                  color 0.2s ease,
                  box-shadow 0.2s ease,
                  border-color 0.2s ease;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .back-home:hover {
      background: var(--purple-mid);
      color: #ffffff;
      border-color: var(--purple-mid);
      transform: translateX(-3px);
      box-shadow: 0 8px 24px rgba(106, 17, 203, 0.30);
    }
    .back-home:active {
      transform: scale(0.96);
    }
    .back-home i {
      font-size: 0.8rem;
      transition: transform 0.2s var(--ios-smooth);
    }
    .back-home:hover i {
      transform: translateX(-2px);
    }

    .container {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
    }

    .card {
      background: var(--white);
      border-radius: 24px;
      padding: 2.2rem 2rem;
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(106,17,203,0.1);
      transition: all 0.2s ease;
    }

    /* ========== ACADEX BRAND / LOGO ========== */
    .brand-header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.4rem;
    }

    .brand-header .logo-icon {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, var(--purple-mid), var(--magenta));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      color: var(--white);
      box-shadow: 0 6px 18px rgba(106,17,203,0.28);
    }

    .brand-header .acadex-brand {
      font-family: var(--font-heading);
      font-weight: 900;
      font-size: 1.85rem;
      letter-spacing: -0.03em;
      color: var(--purple-dark);
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .brand-header .acadex-a {
      background: linear-gradient(135deg, var(--gold) 0%, var(--magenta) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    h1 {
      text-align: center;
      margin-bottom: 0.35rem;
      font-family: var(--font-heading);
      font-weight: 900;
      font-size: 1.7rem;
      color: var(--purple-dark);
      letter-spacing: -0.03em;
    }

    h2 {
      text-align: center;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
      letter-spacing: -0.01em;
      line-height: 1.5;
    }

    .card-header {
      display: flex;
      justify-content: center;
      /* Empty after moving back-home out — harmless, preserved for safety */
    }

    /* ========== FORM ========== */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      color: var(--text-dark);
      font-size: 0.9rem;
      letter-spacing: -0.005em;
    }

    input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--ios-separator);
      border-radius: 14px;
      font-size: 1rem;
      font-family: inherit;
      background: var(--ios-fill-2);
      color: var(--ios-label);
      transition: border-color 0.2s ease,
                  box-shadow 0.2s ease,
                  background 0.2s ease;
      letter-spacing: -0.005em;
    }

    input:focus {
      outline: none;
      background: #ffffff;
      border-color: var(--purple-mid);
      box-shadow: 0 0 0 3px rgba(106,17,203,0.15);
    }

    button[type="submit"] {
      width: 100%;
      padding: 15px 24px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      color: var(--deep-purple);
      border: none;
      border-radius: 999px;
      font-weight: 800;
      cursor: pointer;
      font-size: 1rem;
      font-family: var(--font-body);
      transition: transform 0.15s var(--ios-smooth),
                  box-shadow 0.3s ease;
      letter-spacing: -0.005em;
      box-shadow: 0 6px 18px rgba(255,215,0,0.35);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      -webkit-tap-highlight-color: transparent;
    }

    button[type="submit"]:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(255,215,0,0.5);
    }

    button[type="submit"]:active {
      transform: scale(0.97);
    }

    .links {
      text-align: center;
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .links a {
      color: var(--purple-mid);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 700;
      transition: color 0.2s;
      letter-spacing: -0.005em;
    }

    .links a:hover {
      color: var(--magenta);
      text-decoration: underline;
    }

    .message {
      margin-top: 16px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
    }

    /* 🔐 Password visibility toggle */
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrapper input {
      padding-right: 48px;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      transition: color 0.2s;
      line-height: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .toggle-password:hover {
      color: var(--purple-mid);
    }

    .toggle-password svg {
      width: 20px;
      height: 20px;
    }

    /* ========== MOBILE RESPONSIVE ========== */
    @media (max-width: 480px) {
      body {
        padding: 3.5rem 1rem 1.5rem; /* extra top space for the fixed back button */
      }

      .back-home {
        top: 12px;
        left: 12px;
        padding: 8px 14px;
        font-size: 0.82rem;
      }

      .card {
        padding: 1.6rem 1.35rem;
        border-radius: 20px;
      }

      .brand-header .logo-icon {
        width: 38px;
        height: 38px;
        font-size: 1.15rem;
      }

      .brand-header .acadex-brand {
        font-size: 1.55rem;
      }

      h1 {
        font-size: 1.45rem;
      }

      h2 {
        font-size: 0.95rem;
        margin-bottom: 1.5rem;
      }

      input {
        padding: 12px 14px;
        font-size: 0.95rem;
      }

      button[type="submit"] {
        padding: 13px 20px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <!-- FIXED top-left back button (iOS glass pill) -->
  <a href="index.html" class="back-home">
    <i class="fa-solid fa-arrow-left"></i> Back to Home
  </a>

  <div class="container">
    <div class="card">
      <!-- Acadex Logo & Name -->
      <div class="brand-header">
        <span class="logo-icon"><i class="fa-solid fa-graduation-cap"></i></span>
        <span class="acadex-brand"><span class="acadex-a">A</span>cadex</span>
      </div>

      <!-- Preserved empty card-header (back-home moved to fixed top-left) -->
      <div class="card-header"></div>

      <h1>Single Login</h1>
      <h2>for Admin, Teachers, Students and Parents</h2>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="admin@school.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="••••••••" required>
            <button type="button" class="toggle-password" aria-label="Toggle password visibility">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="eye-icon">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </button>
          </div>
        </div>
        <button type="submit">Login</button>
      </form>

      <div class="links">
        <a href="signup.html">Create a new school</a>
        <a href="reset-password.html">Forgot password?</a>
      </div>
      <div id="message" class="message"></div>
    </div>
  </div>

  <script type="module">
    import { initLoginPage } from './js/auth.js';
    import { showFullscreenLoader, hideFullscreenLoader } from './js/loading.js';

    initLoginPage();

    /* ─────────────────────────────────────────────────────────────
       Loader — shown ONLY when the login button is clicked and the
       form's HTML5 validation passes. Hidden when auth.js writes any
       text to #message (error or status). 30s failsafe covers edge
       cases. On successful login auth.js redirects — the loader
       naturally disappears when the page unloads.
       ───────────────────────────────────────────────────────────── */
    const loginForm = document.getElementById('loginForm');
    const loginMessageEl = document.getElementById('message');

    if (loginForm) {
      loginForm.addEventListener('submit', () => {
        showFullscreenLoader({ label: 'Signing you in…' });

        let hidden = false;
        let failsafeTimer = null;
        let observer = null;
        let pollTimer = null;
        let pollCount = 0;

        const cleanup = () => {
          if (hidden) return;
          hidden = true;
          if (observer) observer.disconnect();
          if (failsafeTimer) clearTimeout(failsafeTimer);
          if (pollTimer) clearInterval(pollTimer);
          hideFullscreenLoader({ minDisplayMs: 300 });
        };

        if (loginMessageEl) {
          observer = new MutationObserver(() => {
            if (loginMessageEl.textContent.trim() !== '') cleanup();
          });
          observer.observe(loginMessageEl, {
            childList: true, subtree: true, characterData: true
          });

          // Poll for the first ~2 s in case auth.js responded synchronously
          pollTimer = setInterval(() => {
            pollCount++;
            if (loginMessageEl.textContent.trim() !== '') {
              cleanup();
              clearInterval(pollTimer);
            }
            if (pollCount > 8) clearInterval(pollTimer);
          }, 250);
        }

        // Failsafe — guarantees the loader always hides
        failsafeTimer = setTimeout(cleanup, 30000);
      });
    }
  </script>
  <script>
    // Unregister any existing service worker, then clear all its caches.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      }).catch(function(err) {
        console.log('Service Worker unregistration failed: ', err);
      });

      if (window.caches) {
        caches.keys().then(function(cacheNames) {
          cacheNames.forEach(function(cacheName) {
            caches.delete(cacheName);
          });
        });
      }
    }
  </script>
</body>
</html>
