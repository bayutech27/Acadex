<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acadex - Change Password</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 4px; font-weight: 500; color: #1e293b; }
    input { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; transition: border-color 0.2s; }
    input:focus { outline: none; border-color: #3b82f6; }
    button[type="submit"] { width: 100%; padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
    button[type="submit"]:hover { background: #2563eb; }
    .card { max-width: 400px; margin: 5rem auto; padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .message { margin-top: 16px; text-align: center; font-size: 0.9rem; }
  </style>
</head>
<body>
<div class="card">
  <h1 style="text-align:center;"><span class="acadex-brand"><span class="acadex-a">A</span>cadex</span></h1>
  <h2>Change Password</h2>
  <form id="changePasswordForm">
    <div class="form-group">
      <label for="newPassword">New Password</label>
      <input type="password" id="newPassword" required minlength="6">
    </div>
    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" required minlength="6">
    </div>
    <button type="submit">Update Password</button>
  </form>
  <div id="message" class="message"></div>
</div>

<script type="module">
  import { auth, db } from './js/firebase-config.js';
  import { updatePassword } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js';
  import { doc, updateDoc } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js';

  const form = document.getElementById('changePasswordForm');
  const messageDiv = document.getElementById('message');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (newPassword !== confirmPassword) {
      messageDiv.textContent = 'Passwords do not match.';
      messageDiv.style.color = 'red';
      return;
    }

    const user = auth.currentUser;
    if (!user) {
      window.location.href = '/';
      return;
    }

    try {
      await updatePassword(user, newPassword);
      // Remove mustChangePassword flag
      await updateDoc(doc(db, 'users', user.uid), { mustChangePassword: false });
      messageDiv.textContent = 'Password updated! Redirecting...';
      messageDiv.style.color = 'green';

      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect') || '/';
      setTimeout(() => { window.location.href = redirect; }, 1500);
    } catch (error) {
      console.error(error);
      messageDiv.textContent = 'Failed to update password. Please try again.';
      messageDiv.style.color = 'red';
    }
  });
</script>
</body>
</html>
