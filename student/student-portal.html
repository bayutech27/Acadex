<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Acadex - Student Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/card-3d.css">

  <style>
    :root {
      --ios-blue:      #007AFF;
      --ios-blue-600:  #0062CC;
      --ios-green:     #34C759;
      --ios-indigo:    #5856D6;
      --ios-orange:    #FF9500;
      --ios-pink:      #FF2D55;
      --ios-purple:    #AF52DE;
      --ios-red:       #FF3B30;
      --ios-teal:      #5AC8FA;
      --ios-yellow:    #FFCC00;

      --ios-bg:            #F2F2F7;
      --ios-bg-elevated:   #FFFFFF;
      --ios-bg-secondary:  #E5E5EA;

      --ios-label:            #000000;
      --ios-label-secondary:  rgba(60, 60, 67, 0.60);
      --ios-label-tertiary:   rgba(60, 60, 67, 0.30);

      --ios-separator: rgba(60, 60, 67, 0.12);
      --ios-fill:      rgba(120, 120, 128, 0.12);

      --ios-radius-sm: 10px;
      --ios-radius:    14px;
      --ios-radius-lg: 18px;
      --ios-radius-xl: 22px;

      --ios-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --ios-shadow:    0 1px 3px rgba(0, 0, 0, 0.04), 0 4px 12px rgba(0, 0, 0, 0.04);
      --ios-shadow-lg: 0 8px 28px rgba(0, 0, 0, 0.08);
      --ios-shadow-xl: 0 20px 50px rgba(0, 0, 0, 0.12);

      --ios-font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif;
      --ios-font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif;

      --ios-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
      --ios-smooth: cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    body {
      font-family: var(--ios-font) !important;
      background: var(--ios-bg) !important;
      color: var(--ios-label);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.011em;
    }

    .dashboard-container {
      display: block !important;
      min-height: 100vh;
    }
    .main-content {
      margin-left: 0 !important;
      width: 100% !important;
      max-width: 100% !important;
    }

    /* =========================================================
       FULL-SCREEN iOS LOADER
       ========================================================= */
    .acadex-fullscreen-loader {
      position: fixed;
      inset: 0;
      background: rgba(242, 242, 247, 0.94);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      z-index: 9998;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.15rem;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    .acadex-fullscreen-loader.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* Spinner — iOS-style partial-arc rotating ring */
    .acadex-spinner svg {
      display: block;
    }
    .acadex-spinner-track {
      stroke: rgba(0, 122, 255, 0.16);
    }
    .acadex-spinner-ring {
      stroke: var(--ios-blue);
      animation: acadex-spin 0.9s linear infinite;
      transform-origin: center;
    }
    @keyframes acadex-spin {
      to { transform: rotate(360deg); }
    }
    .acadex-spinner-lg svg { width: 60px; height: 60px; }
    .acadex-spinner-sm svg { width: 32px; height: 32px; }

    .acadex-loader-label {
      font-family: var(--ios-font);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ios-label-secondary);
      letter-spacing: -0.005em;
    }
    .acadex-loader-failsafe {
      text-align: center;
      padding: 1rem;
    }
    .acadex-loader-failsafe .icon {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
    }
    .acadex-loader-failsafe p {
      color: var(--ios-label-secondary);
      font-size: 0.9rem;
      line-height: 1.5;
      margin: 0;
    }
    .acadex-loader-failsafe a {
      color: var(--ios-blue);
      text-decoration: underline;
    }

    /* Pane loader (inside .tab-pane when clicked) */
    .pane-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 3rem 1rem;
      min-height: 160px;
      background: var(--ios-bg-elevated);
      border-radius: var(--ios-radius-xl);
    }
    .pane-loader .acadex-loader-label {
      font-size: 0.82rem;
    }

    /* =========================================================
       ACADEMIC BADGE
       ========================================================= */
    .academic-badge-row {
      display: flex;
      justify-content: flex-end;
      padding: .45rem 1.75rem;
      background: transparent;
      border-bottom: 1px solid var(--ios-separator);
    }
    .academic-badge {
      background: rgba(0, 122, 255, 0.10);
      color: var(--ios-blue);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      letter-spacing: -0.01em;
      border: 1px solid rgba(0, 122, 255, 0.12);
      box-shadow: none;
      white-space: nowrap;
    }
    .academic-badge i { color: var(--ios-blue); }
    .academic-badge .override-badge {
      background: var(--ios-orange);
      color: #fff;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
    }

    /* =========================================================
       SCHOOL ADDRESS
       ========================================================= */
    .school-address {
      font-size: 0.74rem;
      color: var(--ios-label-secondary);
      margin-top: 3px;
      letter-spacing: -0.005em;
    }

    /* =========================================================
       SUBSCRIPTION BADGE
       ========================================================= */
    .subscription-badge {
      font-weight: 600;
      font-size: 0.75rem;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--ios-fill);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      white-space: nowrap;
      color: var(--ios-label-secondary);
      letter-spacing: -0.005em;
    }
    .subscription-badge.active  { background: rgba(52, 199, 89, 0.14); color: #1B7F3A; }
    .subscription-badge.expired { background: rgba(255, 59, 48, 0.12); color: #B3261E; }

    /* =========================================================
       HEADER LOGOUT BUTTON
       ========================================================= */
    .logout-btn-header {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 59, 48, 0.10);
      color: var(--ios-red);
      border: 1px solid rgba(255, 59, 48, 0.18);
      font-family: var(--ios-font);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: -0.005em;
      line-height: 1;
      cursor: pointer;
