<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acadex – Student Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e9edf2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .access-denied-card {
      background: white;
      max-width: 500px;
      width: 100%;
      border-radius: 1.5rem;
      box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.15);
      text-align: center;
      padding: 2.5rem 2rem;
      transition: transform 0.2s ease;
    }

    .access-denied-card:hover {
      transform: translateY(-5px);
    }

    .denied-icon {
      font-size: 5rem;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.9rem;
      color: #dc2626;
      margin-bottom: 1rem;
      font-weight: 700;
    }

    p {
      color: #4b5563;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }

    .logout-btn {
      background: #0f172a;
      color: white;
      border: none;
      padding: 0.8rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 3rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .logout-btn:hover {
      background: #1e293b;
      transform: scale(1.02);
    }

    .loading-message {
      font-size: 0.9rem;
      color: #64748b;
      margin-top: 1rem;
      display: none;
    }

    @media (max-width: 480px) {
      .access-denied-card {
        padding: 1.8rem 1.2rem;
      }
      h1 { font-size: 1.5rem; }
      .denied-icon { font-size: 4rem; }
    }
  </style>
</head>
<body>
<div class="access-denied-card">
  <div class="denied-icon">🚫</div>
  <h1>Access Denied</h1>
  <p>You do not have access to this portal now.<br>Only authorised student accounts can view this page.</p>
  <button id="logoutBtn" class="logout-btn">🚪 Logout</button>
  <div id="loadingMessage" class="loading-message">Signing out...</div>
</div>

<script type="module">
  // ✅ Use ABSOLUTE path from project root
  import { initStudentPortal, logoutUser } from '/js/auth.js';

  // Protect page (redirects to '/' if not a student)
  initStudentPortal();

  const logoutBtn = document.getElementById('logoutBtn');
  const loadingMsg = document.getElementById('loadingMessage');

  logoutBtn.addEventListener('click', async () => {
    if (loadingMsg) loadingMsg.style.display = 'block';
    try {
      await logoutUser();  // defined in auth.js → redirects to '/'
    } catch (error) {
      console.error('Logout failed:', error);
      alert('Logout failed. Please try again.');
    } finally {
      if (loadingMsg) loadingMsg.style.display = 'none';
    }
  });
</script>
</body>
</html>
