<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acadex - Teacher Dashboard</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    /* Enhanced card styles */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin: 2rem 0;
    }
    .clickable-card {
      background: white;
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
      transition: all 0.2s ease;
      cursor: pointer;
      text-align: center;
      border: 1px solid #e2e8f0;
    }
    .clickable-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
      border-color: #cbd5e1;
    }
    .card-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .card-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #1e293b;
    }
    .card-desc {
      font-size: 0.875rem;
      color: #64748b;
      line-height: 1.4;
    }
    .disabled-card {
      opacity: 0.6;
      cursor: not-allowed;
      pointer-events: none;
      filter: grayscale(0.1);
    }
    .disabled-card:hover {
      transform: none;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }

    /* Hide hamburger on desktop */
    @media (min-width: 769px) {
      .hamburger-menu {
        display: none !important;
      }
    }

    @media (max-width: 640px) {
      .stats-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      .clickable-card {
        padding: 1.25rem;
      }
      .card-icon {
        font-size: 2.5rem;
      }
      .card-title {
        font-size: 1.25rem;
      }
      .card-desc {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
<div class="dashboard-container">
  <!-- Desktop Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="acadex-brand"><span class="acadex-a">A</span>cadex</span>
    </div>
    <nav class="sidebar-nav">
      <a href="teacher-dashboard.html" class="active">Dashboard</a>
      <a href="class.html">Class</a>
      <a href="scores.html" id="scoresLink">Scores</a>
    </nav>
  </aside>

  <!-- Mobile Sidebar -->
  <div id="mobileSidebar" class="mobile-sidebar">
    <div class="mobile-sidebar-header">
      <span class="acadex-brand"><span class="acadex-a">A</span>cadex</span>
      <button class="close-sidebar">&times;</button>
    </div>
    <nav class="sidebar-nav">
      <a href="teacher-dashboard.html" class="active">Dashboard</a>
      <a href="class.html">Class</a>
      <a href="scores.html">Scores</a>
    </nav>
    <div class="mobile-logout-wrapper">
      <button class="mobile-logout-btn">Logout</button>
    </div>
  </div>
  <div id="overlay" class="overlay"></div>

  <main class="main-content">
    <!-- Header -->
    <header class="header">
      <div class="school-header-left">
        <div class="school-logo">
          <img id="schoolLogoImg" class="logo-circle" alt="School Logo">
          <div id="cameraIcon" class="camera-icon">📷</div>
          <input type="file" id="logoUploadInput" accept="image/*" style="display:none">
        </div>
        <div class="school-name">
          <h1 id="schoolName">Loading...</h1>
          <div id="schoolAddress" class="school-address"></div>
        </div>
      </div>
      <div class="header-right">
        <button class="hamburger-menu" aria-label="Menu">☰</button>
        <div id="subscriptionBadge" class="subscription-badge"></div>
        <button id="logoutBtn" class="logout-btn">Logout</button>
      </div>
    </header>

    <!-- Academic Badge Row -->
    <div class="academic-badge-row">
      <div id="academicCalendarDisplay" class="academic-badge">
        <span id="currentTermDisplay">Loading...</span> | 
        <span id="currentSessionDisplay"></span>
      </div>
    </div>

    <div class="content">
      <div class="welcome-card">
        <h1 id="welcomeHeading">Welcome, Teacher</h1>
        <p>Manage your students, class, and scores.</p>
      </div>

      <div class="stats-grid">
        <div class="clickable-card" id="classCard">
          <div class="card-icon">🏫</div>
          <div class="card-title">Class</div>
          <div class="card-desc">Manage your homeroom class (if assigned)</div>
        </div>
        <div class="clickable-card" id="scoresCard">
          <div class="card-icon">📊</div>
          <div class="card-title">Scores</div>
          <div class="card-desc">Enter and manage exam scores</div>
        </div>
      </div>
    </div>

    <footer class="app-footer">
      <p>&copy; <span id="currentYear"></span> Acadex. All rights reserved.</p>
    </footer>
  </main>
</div>

<script type="module">
  import { 
    protectTeacherPage, 
    loadSchoolInfo, 
    setupSidebar, 
    setupLogout, 
    setupLogoUpload, 
    checkClassTeacherStatus, 
    displayTeacherName 
  } from '../js/teacher-dashboard.js';
  import { initMobileMenu } from '../js/menu.js';
  import { subscribeToCalendar } from '../js/academic-calendar.js';

  document.getElementById('currentYear').innerText = new Date().getFullYear();

  protectTeacherPage().then(async ({ teacherName }) => {
    displayTeacherName(teacherName);
    loadSchoolInfo();
    setupSidebar();
    setupLogout();
    setupLogoUpload();
    initMobileMenu();

    const classCard = document.getElementById('classCard');
    const isClassTeacher = await checkClassTeacherStatus();

    if (!isClassTeacher) {
      classCard.classList.add('disabled-card');
      classCard.addEventListener('click', (e) => {
        e.preventDefault();
        alert('You are not assigned as a class teacher. You cannot access this page.');
      });
      const classLink = document.querySelector('.sidebar-nav a[href="class.html"]');
      if (classLink) {
        classLink.addEventListener('click', (e) => {
          e.preventDefault();
          alert('You are not assigned as a class teacher.');
        });
      }
    } else {
      classCard.addEventListener('click', () => { window.location.href = 'class.html'; });
    }

    document.getElementById('scoresCard').addEventListener('click', () => { window.location.href = 'scores.html'; });

    const mobileLogoutBtn = document.querySelector('.mobile-logout-btn');
    const headerLogoutBtn = document.getElementById('logoutBtn');
    if (mobileLogoutBtn && headerLogoutBtn) {
      mobileLogoutBtn.addEventListener('click', () => headerLogoutBtn.click());
    }
  });

  subscribeToCalendar((state) => {
    const termEl = document.getElementById('currentTermDisplay');
    const sessionEl = document.getElementById('currentSessionDisplay');
    if (termEl) termEl.textContent = state.currentTerm;
    if (sessionEl) sessionEl.textContent = state.currentSession;
    if (state.manualOverride) termEl?.classList.add('override-badge');
    else termEl?.classList.remove('override-badge');
  });
</script>
</body>
</html>
