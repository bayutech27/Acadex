<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Acadex - Reset Password</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Additional inline styles to match signup.html */
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
      color: #1e293b;
    }
    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    button[type="submit"] {
      width: 100%;
      padding: 10px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    button[type="submit"]:hover {
      background: #2563eb;
    }
    .links {
      text-align: center;
      margin-top: 16px;
    }
    .links a {
      color: #3b82f6;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .links a:hover {
      text-decoration: underline;
    }
    .message {
      margin-top: 16px;
      text-align: center;
      font-size: 0.9rem;
    }
    @media (max-width: 480px) {
      .card {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1><span class="acadex-brand"><span class="acadex-a">A</span>cadex</span></h1>
    <h2>Reset Password</h2>

    <form id="resetForm">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="admin@school.com" required>
      </div>
      <button type="submit">Send Reset Link</button>
    </form>

    <div class="links">
      <a href="index.html">← Back to Login</a>
    </div>
    <div id="message" class="message"></div>
  </div>
</div>

<script type="module">
  import { initResetPasswordPage } from './js/auth.js';
  initResetPasswordPage();
</script>
<script>
  // Unregister any existing service worker, then clear all its caches.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      for (let registration of registrations) {
        registration.unregister();
      }
    }).catch(function(err) {
      console.log('Service Worker unregistration failed: ', err);
    });

    // Also delete all caches just in case.
    if (window.caches) {
      caches.keys().then(function(cacheNames) {
        cacheNames.forEach(function(cacheName) {
          caches.delete(cacheName);
        });
      });
    }
  }
</script>
</body>
</html>
