<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Acadex - Login</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Additional inline styles to match signup.html */
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
      color: #1e293b;
    }
    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    button[type="submit"] {
      width: 100%;
      padding: 10px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    button[type="submit"]:hover {
      background: #2563eb;
    }
    .links {
      text-align: center;
      margin-top: 16px;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .links a {
      color: #3b82f6;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .links a:hover {
      text-decoration: underline;
    }
    .message {
      margin-top: 16px;
      text-align: center;
    }
    @media (max-width: 480px) {
      .card {
        padding: 20px;
      }
      .links {
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1><span class="acadex-brand"><span class="acadex-a">A</span>cadex</span></h1>
    <h2>Login to your school</h2>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="admin@school.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit">Login</button>
    </form>

    <div class="links">
      <a href="signup.html">Create a new school</a>
      <a href="reset-password.html">Forgot password?</a>
    </div>
    <div id="message" class="message"></div>
  </div>
</div>

<script type="module">
  import { initLoginPage } from './js/auth.js';
  initLoginPage();
</script>
</body>
</html>
