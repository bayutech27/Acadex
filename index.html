<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Acadex - Login</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 4px; font-weight: 500; color: #1e293b; }
    input { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; transition: border-color 0.2s; }
    input:focus { outline: none; border-color: #3b82f6; }
    button[type="submit"] { width: 100%; padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
    button[type="submit"]:hover { background: #2563eb; }
    .links { text-align: center; margin-top: 16px; display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
    .links a { color: #3b82f6; text-decoration: none; font-size: 0.9rem; }
    .links a:hover { text-decoration: underline; }
    .message { margin-top: 16px; text-align: center; }

    /* 🔐 Password visibility toggle */
    .password-wrapper { position: relative; display: flex; align-items: center; }
    .password-wrapper input { padding-right: 40px; }
    .toggle-password {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      transition: color 0.2s;
      line-height: 0;
    }
    .toggle-password:hover { color: #1e293b; }
    .toggle-password svg { width: 20px; height: 20px; }

    @media (max-width: 480px) {
      .card { padding: 20px; }
      .links { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1><span class="acadex-brand"><span class="acadex-a">A</span>cadex</span></h1>
    <h2>Single Login for Admin, Teachers and Students</h2>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="admin@school.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="••••••••" required>
          <button type="button" class="toggle-password" aria-label="Toggle password visibility">
            <!-- eye icon (visible state) -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="eye-icon">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>
        </div>
      </div>
      <button type="submit">Login</button>
    </form>

    <div class="links">
      <a href="signup.html">Create a new school</a>
      <a href="reset-password.html">Forgot password?</a>
    </div>
    <div id="message" class="message"></div>
  </div>
</div>

<script type="module">
  import { initLoginPage } from './js/auth.js';
  initLoginPage();
</script>
<script>
  // Register Service Worker for offline navigation
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(registration => {
          console.log('Service Worker registered with scope:', registration.scope);
          // Optional: check for updates every hour
          setInterval(() => registration.update(), 60 * 60 * 1000);
        })
        .catch(err => {
          console.error('Service Worker registration failed:', err);
        });
    });
  }
</script>
</body>
</html>
